name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
      - name: Install Conftest
        run: scripts/install_conftest.sh
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff
      - name: terraform validate
        run: |
          for d in bootstrap infra; do
            terraform -chdir=$d init -backend=false -input=false >/dev/null
            terraform -chdir=$d validate
          done
      - name: Policy unit tests (conftest verify)
        run: conftest verify --policy policy --show-builtin-errors
      - name: Report unit tests
        run: python3 -m unittest discover -s report -v
      - name: shellcheck
        run: shellcheck scripts/*.sh

  # Shift-left: the same policies run against the PR's plan, before merge.
  pr-plan:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/77998669597/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: tf-drift-ci@tf-drift-sandbox-ntd6t.iam.gserviceaccount.com
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.2
          terraform_wrapper: false
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}
      - name: Install Conftest
        run: scripts/install_conftest.sh
      - run: terraform -chdir=infra init -input=false
      - name: Plans, policies, report
        run: scripts/plan_and_report.sh out
      - name: Comment the report on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          cat out/report.md >> "$GITHUB_STEP_SUMMARY"
          gh pr comment "$PR" --edit-last --create-if-none --body-file out/report.md
      - name: Fail on policy violations introduced by this change
        run: |
          n=$(jq '[.[].failures[]?.msg | select(startswith("[planned]"))] | length' out/conftest.json)
          if [ "$n" -gt 0 ]; then
            jq -r '.[].failures[]?.msg | select(startswith("[planned]")) | "::error::" + .' out/conftest.json
            exit 1
          fi
          echo "No planned policy violations."
